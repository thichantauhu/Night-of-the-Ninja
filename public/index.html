<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đêm Ninja — Online</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/ui-fixes.css">
</head>
<body>
<div id="app">
<section id="lobby" class="screen"><div class="brand"><span class="moon">☾</span><div><h1>ĐÊM NINJA</h1><p>Hai Nhà. Một đêm. Không ai biết ai.</p></div></div><div class="panel lobby-panel"><input id="name" maxlength="20" placeholder="Tên của bạn" autocomplete="off"><div class="row"><button id="create">Tạo phòng</button><input id="code" maxlength="5" placeholder="MÃ PHÒNG"><button id="join" class="secondary">Vào phòng</button></div><p id="msg" class="msg"></p></div></section>
<section id="game" class="screen hidden"><header class="topbar"><div class="brand small"><span class="moon">☾</span><b>ĐÊM NINJA</b></div><div class="room-chip">PHÒNG <strong id="roomCode"></strong></div><div class="top-actions"><button id="pause" class="secondary">Tạm dừng</button><button id="end" class="danger">Kết thúc</button></div></header>
<main class="layout"><aside class="players panel"><div class="section-title">NGƯỜI CHƠI <span id="count"></span></div><div id="players"></div></aside><section class="board"><div class="phasebar"><div><span class="eyebrow">VÒNG <b id="round">0</b></span><h2 id="phase">PHÒNG CHỜ</h2></div><div class="phase-list" id="phaseList"></div></div><div id="notice" class="notice"></div><div id="center" class="center panel"></div><div id="hand" class="hand"><div id="actionArea"></div></div></section><aside class="side"><div class="panel secret"><div class="section-title">BÍ MẬT CỦA BẠN</div><div class="secret-card"><span>NHÀ</span><strong id="house">—</strong></div><div class="secret-card"><span>THỨ HẠNG</span><strong id="rank">—</strong></div><div class="secret-card"><span>DANH DỰ</span><strong id="honor">0</strong></div><div class="section-title known-title">THÔNG TIN ĐÃ BIẾT</div><div id="known" class="known">Chưa có thông tin.</div></div><div class="panel chat"><div class="section-title">TRÒ CHUYỆN</div><div id="messages" class="messages"></div><div class="chat-row"><input id="chatInput" placeholder="Nói gì đó..."><button id="sendChat">Gửi</button></div></div></aside></main></section>
</div><script src="/app.js"></script><script src="/ui-fixes.js"></script><script src="/draft-strict.js"></script><script src="/reveal-fixes.js"></script></body></html>
